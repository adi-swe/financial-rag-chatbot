version: "3.9"

services:
  ollama:
    image: ollama/ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama:/root/.ollama

  backend:
    build: ./backend
    ports:
      - "5000:5000"
    environment:
      - OLLAMA_BASE_URL=http://ollama:11434
      - OLLAMA_CHAT_MODEL=llama3.1
      - OLLAMA_EMBED_MODEL=nomic-embed-text
    volumes:
      - ./backend/vectorstore:/app/vectorstore
      - ./backend/data/uploads:/app/data/uploads
    depends_on:
      - ollama

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: http://localhost:5000
    ports:
      - "5173:80"
    depends_on:
      - backend

volumes:
  ollama:
