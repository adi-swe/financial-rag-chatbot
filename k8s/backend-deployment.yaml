apiVersion: apps/v1
kind: Deployment
metadata:
  name: financial-rag-backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: financial-rag-backend
  template:
    metadata:
      labels:
        app: financial-rag-backend
    spec:
      containers:
        - name: backend
          image: financial-rag-backend:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 5000
          envFrom:
            - configMapRef:
                name: ollama-config
