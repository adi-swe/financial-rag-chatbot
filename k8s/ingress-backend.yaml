apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: financial-rag-backend
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /$2
    nginx.ingress.kubernetes.io/use-regex: "true"
spec:
  rules:
    - http:
        paths:
          - path: /api(/|$)(.*)
            pathType: Prefix
            backend:
              service:
                name: financial-rag-backend
                port:
                  number: 5000
